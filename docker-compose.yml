services:
  # -- Laravel App (PHP-FPM + Nginx) --------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: webdevhq-app
    restart: unless-stopped
    ports:
      - '8000:80'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/http.d/default.conf:ro
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
      - ./app:/var/www/html/app
      - ./bootstrap:/var/www/html/bootstrap
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./tests:/var/www/html/tests
      - ./public:/var/www/html/public
      - ./.env:/var/www/html/.env
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=webdevhqcom_dev
      - DB_USERNAME=root
      - DB_PASSWORD=groot
    entrypoint: ['/usr/local/bin/entrypoint.sh']
    develop:
      watch:
        - action: rebuild
          path: ./composer.json
        - action: rebuild
          path: ./composer.lock
    networks:
      - webdevhq

  # -- MySQL 8 ------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: webdevhq-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: webdevhqcom_dev
      MYSQL_ROOT_PASSWORD: groot
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - webdevhq

  # -- Vite Dev Server (HMR) ---------------------------------
  node:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: webdevhq-node
    restart: unless-stopped
    working_dir: /app
    ports:
      - '5173:5173'
    volumes:
      - ./resources:/app/resources
      - ./routes:/app/routes
      - ./public:/app/public
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
    environment:
      - DB_HOST=mysql
      - DB_USERNAME=root
      - DB_PASSWORD=groot
      - DB_DATABASE=webdevhqcom_dev
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "npm run dev -- --host 0.0.0.0"
    develop:
      watch:
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
    networks:
      - webdevhq

  # -- phpMyAdmin ---------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: webdevhq-phpmyadmin
    restart: unless-stopped
    ports:
      - '8080:80'
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: groot
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - webdevhq

volumes:
  mysql-data:

networks:
  webdevhq:
    driver: bridge
