services:
  # -- Laravel App (PHP-FPM + Nginx) --------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: webdevhq-app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/http.d/default.conf:ro
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=webdevhqcom_dev
      - DB_USERNAME=root
      - DB_PASSWORD=groot
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    develop:
      watch:
        - action: sync
          path: ./app
          target: /var/www/html/app
          initial_sync: true
        - action: sync
          path: ./bootstrap
          target: /var/www/html/bootstrap
          initial_sync: true
          ignore:
            - cache/
        - action: sync
          path: ./resources
          target: /var/www/html/resources
          initial_sync: true
        - action: sync
          path: ./routes
          target: /var/www/html/routes
          initial_sync: true
        - action: sync
          path: ./config
          target: /var/www/html/config
          initial_sync: true
        - action: sync
          path: ./database
          target: /var/www/html/database
          initial_sync: true
        - action: sync
          path: ./tests
          target: /var/www/html/tests
          initial_sync: true
        - action: sync
          path: ./public
          target: /var/www/html/public
          initial_sync: true
          ignore:
            - build/
        - action: sync
          path: ./artisan
          target: /var/www/html/artisan
          initial_sync: true
        - action: sync
          path: ./.env
          target: /var/www/html/.env
          initial_sync: true
        - action: rebuild
          path: ./composer.json
        - action: rebuild
          path: ./composer.lock
    networks:
      - webdevhq

  # -- MySQL 8 ------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: webdevhq-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: webdevhqcom_dev
      MYSQL_ROOT_PASSWORD: groot
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webdevhq

  # -- Vite Dev Server (HMR) ---------------------------------
  node:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: webdevhq-node
    working_dir: /app
    ports:
      - "5173:5173"
    # volumes:
      # - ./resources:/app/resources
      # - ./public:/app/public
    environment:
      - DB_HOST=mysql
      - DB_USERNAME=root
      - DB_PASSWORD=groot
      - DB_DATABASE=webdevhqcom_dev
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "npm run dev -- --host 0.0.0.0"
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
          initial_sync: true
        - action: sync
          path: ./resources
          target: /app/resources
          initial_sync: true
        - action: sync
          path: ./routes
          target: /app/routes
          initial_sync: true
        - action: sync+restart
          path: ./vite.config.ts
          target: /app/vite.config.ts
          initial_sync: true
        - action: sync+restart
          path: ./tsconfig.json
          target: /app/tsconfig.json
          initial_sync: true
        - action: sync+restart
          path: ./.env
          target: /app/.env
          initial_sync: true
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
    networks:
      - webdevhq

  # -- phpMyAdmin ---------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: webdevhq-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: groot
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - webdevhq

volumes:
  mysql-data:

networks:
  webdevhq:
    driver: bridge
