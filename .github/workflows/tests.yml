name: tests

on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate Wayfinder types
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          APP_KEY: base64:u8vS6Yx9f9vH9Z9z9y9x9w9v9u9t9s9r9q9p9o9n9m=
        run: php -d memory_limit=512M artisan wayfinder:generate --fresh

      - name: Build Assets
        env:
          VITE_API_VERSION: v1
          CI: 'true'
        run: npm run build

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Cache Routes
        run: php artisan route:cache

      - name: Tests
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: ./vendor/bin/pest
